name: Render & Publish Pipeline

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'Episode ID to render'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install requests google-api-python-client google-auth-oauthlib google-auth-httplib2 Pillow

      - name: Execute Render Engine
        env:
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          WEBAPP_TOKEN: ${{ secrets.WEBAPP_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VFX_DRIVE_FOLDER_ID: ${{ secrets.VFX_DRIVE_FOLDER_ID }}
          OPERATOR_EMAIL: ${{ secrets.OPERATOR_EMAIL }}
        run: |
          python render_engine.py --episode_id "${{ github.event.inputs.episode_id }}"
